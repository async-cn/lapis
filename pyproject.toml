[project]
name = "lapis"
version = "0.0.1"
description = "A SDK to make Minecraft Plugin/Mod with Python"
authors = [{name = "Oasis Studio", email = "oasismc@qq.com"}]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
   "Programming Language :: Python :: 3",
   "License :: OSI Approved :: MIT License",
   "Operating System :: OS Independent"
]
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"